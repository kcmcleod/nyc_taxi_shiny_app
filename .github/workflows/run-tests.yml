name: Run Shiny Tests

# This triggers the pipeline on every push to the main/master branch
on:
  push:
    branches: [ main, yellow_taxi_mvp ]
  pull_request:
    branches: [ main, yellow_taxi_mvp ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Passes the default GitHub token to avoid API rate limits during setup
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Uses pre-compiled binaries to speed up installation

      - name: Install system dependencies (required for some R packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Run testthat and shinytest2
        run: |
          # Runs all test files in your tests/testthat directory
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
        env:
          CI: "true"
          NOT_CRAN: "true"

      - name: Calculate and Export Code Coverage
        run: |
          app_sources <- list.files("R", pattern = "\\.[Rr]$", full.names = TRUE)
          app_tests <- list.files("tests/testthat", pattern = "\\.[Rr]$", full.names = TRUE)
          
          # 1. Filter out the shinytest2 tests and setup files
          unit_tests <- grep("shinytest2|setup", app_tests, value = TRUE, invert = TRUE)
          
          # 2. Filter out non-function source files
          core_sources <- grep("_disable", app_sources, value = TRUE, invert = TRUE)
          
          # 3. Run coverage only on the pure unit tests
          cov_results <- covr::file_coverage(
            source_files = core_sources, 
            test_files = unit_tests 
          )
          
          # 4. Export to a standard format that Codecov understands
          covr::to_cobertura(cov_results, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false # Prevents the whole pipeline failing if Codecov is down
          token: ${{ secrets.CODECOV_TOKEN }}